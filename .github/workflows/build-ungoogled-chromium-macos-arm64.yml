name: Build Ungoogled Chromium macOS arm64

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Choose CI Runner Label'
        required: true
        default: 'bitrise-runner-local-system'
        type: string
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Ungoogled Chromium (arm64)
    runs-on: ${{ inputs.runner || 'bitrise-runner-local-system' }}
    timeout-minutes: 1440

    env:
      SCCACHE_DIR: /Users/vagrant/.cache/sccache
      SCCACHE_CACHE_SIZE: 7G
      SCCACHE_IDLE_TIMEOUT: "0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          submodules: recursive

      - name: Inspect Runner Hardware & Environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Architecture ==="
          uname -m
          echo "=== macOS Version ==="
          sw_vers
          echo "=== CPU Info ==="
          sysctl -n hw.ncpu || true
          sysctl -n hw.physicalcpu || true
          sysctl -n machdep.cpu.brand_string || true
          echo "=== Memory Info ==="
          sysctl -n hw.memsize || true
          echo "=== Available Disk Space ==="
          df -h /
          echo "=== Installed Xcode ==="
          xcodebuild -version || true
          echo "=== Clang Version ==="
          clang --version || true
          echo "=== Python Version ==="
          python3 --version || true

      - name: Cleanup unnecessary toolchains to free disk space
        shell: bash
        run: |
          sudo rm -rf "$ANDROID_HOME" "$ANDROID_NDK_HOME" /Library/Developer/CommandLineTools || true
          sudo mdutil -a -i off || true
          df -h /

      - name: Prepare Xcode & Developer Tools
        shell: bash
        run: |
          set -euxo pipefail
          cp -va ./.github/scripts/ ./
          chmod +x *.sh
          ./github_prepare_xcode.sh

      - name: Install Build Dependencies & sccache
        shell: bash
        run: |
          set -euxo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install coreutils ninja go rust sccache gpatch || true
          export PATH="/opt/homebrew/opt/gpatch/libexec/gnubin:/opt/homebrew/bin:$HOME/.cargo/bin:/usr/local/bin:$PATH"
          export PATCH_BIN="$(which gpatch || which patch)"
          cargo install bindgen-cli || true
          which bindgen || true
          which sccache && sccache --version || true
          which gpatch || true
          
          for py in python3 python $(which -a python3 2>/dev/null) $(which -a python 2>/dev/null) /Users/vagrant/.asdf/shims/python3 /Users/vagrant/.asdf/installs/python/*/bin/python3; do
            if [ -x "$py" ] || command -v "$py" >/dev/null 2>&1; then
              "$py" -m pip install --break-system-packages httplib2 PySocks urllib3 setuptools wheel || true
            fi
          done

      - name: Restore Compiler Cache (GitHub Actions Cache)
        uses: actions/cache@v4
        with:
          path: /Users/vagrant/.cache/sccache
          key: sccache-macos-arm64-${{ github.sha }}
          restore-keys: |
            sccache-macos-arm64-

      - name: Retrieve Chromium Source
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/homebrew/opt/gpatch/libexec/gnubin:/opt/homebrew/bin:$HOME/.cargo/bin:/usr/local/bin:$PATH"
          export PATCH_BIN="$(which gpatch || which patch)"
          for py in python3 python $(which -a python3 2>/dev/null) $(which -a python 2>/dev/null) /Users/vagrant/.asdf/shims/python3 /Users/vagrant/.asdf/installs/python/*/bin/python3; do
            if [ -x "$py" ] || command -v "$py" >/dev/null 2>&1; then
              "$py" -m pip install --break-system-packages httplib2 PySocks urllib3 setuptools wheel || true
            fi
          done
          if [ ! -d "build/src/chrome" ]; then
            ./retrieve_and_unpack_resource.py -g arm64
          else
            echo "Reusing existing Chromium source tree at build/src"
          fi

      - name: Configure Ungoogled Chromium Patches & Substitutions
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/homebrew/opt/gpatch/libexec/gnubin:/opt/homebrew/bin:$HOME/.cargo/bin:/usr/local/bin:$PATH"
          export PATCH_BIN="$(which gpatch || which patch)"
          _src_dir="build/src"
          _main_repo="ungoogled-chromium"

          mkdir -p "$_src_dir/out/Default"

          # 1. Prune Google proprietary binaries
          python3 "$_main_repo/utils/prune_binaries.py" "$_src_dir" "$_main_repo/pruning.list" || true

          # 2. Apply patches (including custom Arc 2x3 grid)
          python3 "$_main_repo/utils/patches.py" apply "$_src_dir" "$_main_repo/patches" "./patches"

          # 3. Domain substitution
          python3 "$_main_repo/utils/domain_substitution.py" apply -r "$_main_repo/domain_regex.list" -f "$_main_repo/domain_substitution.list" "$_src_dir" || true

          # 4. Generate gn build flags with sccache wrapper
          cat "$_main_repo/flags.gn" "./flags.macos.gn" > "$_src_dir/out/Default/args.gn"
          echo 'target_cpu = "arm64"' >> "$_src_dir/out/Default/args.gn"
          echo 'cc_wrapper = "sccache"' >> "$_src_dir/out/Default/args.gn"

          # 5. Retrieve platform-specific toolchains
          mkdir -p "$_src_dir/third_party/llvm-build/Release+Asserts"
          mkdir -p "$_src_dir/third_party/rust-toolchain/bin"
          if [ ! -f "$_src_dir/third_party/llvm-build/Release+Asserts/bin/clang" ]; then
            ./retrieve_and_unpack_resource.py -p arm64
          fi
          chmod +x "$_src_dir/third_party/rust-toolchain/bin/bindgen" || true

          # Fix LLVM libc++ on macOS 14
          _llvm_lib="$_src_dir/third_party/llvm-build/Release+Asserts/lib"
          rm -f "$_llvm_lib"/libc++* || true
          ln -sf /usr/lib/libc++.1.dylib "$_llvm_lib/libc++.1.dylib" || true
          ln -sf /usr/lib/libc++.1.dylib "$_llvm_lib/libc++.dylib" || true
          ln -sf /usr/lib/libc++abi.dylib "$_llvm_lib/libc++abi.1.dylib" || true
          ln -sf /usr/lib/libc++abi.dylib "$_llvm_lib/libc++abi.dylib" || true

      - name: Bootstrap GN & Generate Build Graph
        shell: bash
        run: |
          set -euxo pipefail
          cd build/src

          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export NINJA="$(which ninja || echo /opt/homebrew/bin/ninja)"
          export LIBCLANG_PATH="$(pwd)/third_party/llvm-build/Release+Asserts/lib"

          sed -i '' 's/-std=c++23/-std=c++20/g' tools/gn/build/gen.py 2>/dev/null || sed -i 's/-std=c++23/-std=c++20/g' tools/gn/build/gen.py || true

          mkdir -p out/Default
          if [ ! -f "out/Default/gn" ]; then
            ./tools/gn/bootstrap/bootstrap.py -o out/Default/gn --skip-generate-buildfiles
          fi
          ./out/Default/gn gen out/Default --fail-on-unused-args

      - name: Build Chromium (arm64) with sccache
        shell: bash
        run: |
          set -euxo pipefail
          cd build/src

          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export LIBCLANG_PATH="$(pwd)/third_party/llvm-build/Release+Asserts/lib"
          
          mkdir -p "$SCCACHE_DIR"
          sccache --start-server || true
          sccache --zero-stats || true

          CORES="$(sysctl -n hw.ncpu)"
          echo "Compiling Chromium with sccache across $CORES threads..."

          ninja -C out/Default -j"$CORES" chrome chromedriver

          echo "=== sccache Cache Stats ==="
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Validate output binary
        shell: bash
        run: |
          set -euxo pipefail
          _app_path="build/src/out/Default/Chromium.app"

          file "$_app_path/Contents/MacOS/Chromium" || true
          lipo -info "$_app_path/Contents/MacOS/Chromium" || true
          codesign --display --verbose=2 "$_app_path" 2>&1 || true
          du -sh "$_app_path"

      - name: Package Application (DMG & ZIP)
        shell: bash
        run: |
          set -euxo pipefail
          CHROMIUM_SRC_DIR="build/src" ./sign_and_package_app.sh || true

          cd build/src/out/Default
          ditto -c -k --sequesterRsrc --keepParent \
            Chromium.app \
            ../../../../UngoogledChromium-macOS-arm64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ungoogled-chromium-macos-arm64
          path: |
            UngoogledChromium-macOS-arm64.zip
            build/src/out/Default/*.dmg
            build/src/out/Default/*.zip
          retention-days: 7

      - name: Auto Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v134.0.6998.35-arc-$(date +%s)"
          gh release create "$TAG" UngoogledChromium-macOS-arm64.zip \
            --title "Ungoogled Chromium macOS arm64 with Arc Grid" \
            --notes "### Native Ungoogled Chromium build with Arc 2x3 Pinned Grid
          - **Architecture**: Apple Silicon (arm64 native)
          - **Feature**: Arc-style 2x3 pinned tab grid in native vertical tab strip
          - **Binary Verified**: Mach-O 64-bit arm64 app bundle
          - **Compiler Cache**: Integrated with sccache (7GB quota)" || true
