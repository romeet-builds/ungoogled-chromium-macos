name: Publish Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID to publish'
        required: true
        type: string
        default: '34478719767'
      tag_name:
        description: 'Release Tag'
        required: true
        type: string
        default: '134.0.6998.35-1.1-arm64'
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Artifact from Run
        uses: actions/download-artifact@v4
        with:
          name: ungoogled-chromium-macos-arm64
          run-id: ${{ github.event.inputs.run_id || '34478719767' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./release-files

      - name: List Files
        run: ls -la ./release-files

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          gh release create "$TAG" ./release-files/* \
            --title "Ungoogled Chromium macOS arm64 ($TAG)" \
            --notes "### Native Ungoogled Chromium build for Apple Silicon (macOS arm64)
          - **Architecture**: Apple Silicon (arm64 native)
          - **Features**: Arc-style 2x3 pinned tab grid sidebar layout + full Ungoogled privacy patches
          - **Verified**: Mach-O 64-bit arm64 executable signed app bundle"
